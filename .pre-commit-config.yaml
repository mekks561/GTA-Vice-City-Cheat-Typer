# 本地提交前检查（dev-only；不改变运行时零依赖）
#
# 前置：uv sync --extra dev   （创建 .venv 并装齐 ruff / coverage / pre-commit）
# 安装：uv run pre-commit install && uv run pre-commit install --hook-type pre-push
#
# 这里全部用 repo: local —— 直接调用 .venv 里的工具：
#   * 版本与 CI 完全一致（同一份 uv.lock）
#   * 不在提交时访问 GitHub 克隆钩子仓库（弱网/受限网络环境也能用）
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check --force-exclude --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/ruff.exe format --force-exclude
        language: system
        types: [python]

      - id: unittest
        name: unittest (全部用例)
        entry: .venv/Scripts/python.exe -m unittest discover -s tests
        language: system
        pass_filenames: false
        stages: [pre-push]
