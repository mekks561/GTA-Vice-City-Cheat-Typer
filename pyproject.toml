[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-cheat-typer"
version = "2.1.0"
description = "VC-Cheat-Typer - Windows keyboard-input tool with a reusable zero-GUI core"
readme = "README.en.md"
requires-python = ">=3.8"
# 运行时零依赖（只用标准库 + ctypes Win32）；dev 里的包仅开发期需要
dependencies = []

[project.scripts]
vcct = "vcct.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["vcct", "vcct.core"]

[tool.ruff]
line-length = 140
target-version = "py38"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501 行超限：中文注释密集，交由 line-length=140 宽限
ignore = ["E501"]
