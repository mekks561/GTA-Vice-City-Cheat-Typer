[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-cheat-typer"
version = "2.2.0"
description = "VC-Cheat-Typer - Windows keyboard-input tool with a reusable zero-GUI core"
readme = "README.en.md"
requires-python = ">=3.8"
# 运行时零依赖（只用标准库 + ctypes Win32）；dev 里的包仅开发期需要
dependencies = []

[project.scripts]
vcct = "vcct.cli:main"

[project.optional-dependencies]
# dev-only：运行时仍然零依赖，这些包只用于开发/CI。
# 全部加 python_version>=3.10 标记：运行时仍支持 3.8+，但开发工具链与 CI 一致（3.10/3.12），
# 这样 `uv lock` 的 3.8 分支不会被 pre-commit 等要求 3.9+/3.10+ 的包卡死。
dev = [
    "pytest>=7; python_version >= '3.10'",
    "ruff>=0.4; python_version >= '3.10'",
    "pyright>=1.1.380; python_version >= '3.10'",
    "coverage>=7.4; python_version >= '3.10'",
    "pre-commit>=3.6; python_version >= '3.10'",
    "hypothesis>=6.98; python_version >= '3.10'",
]

[tool.setuptools]
packages = ["vcct", "vcct.core", "vcct.ui"]

[tool.ruff]
line-length = 140
target-version = "py38"
exclude = ["tests", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501 行超限：中文注释密集，交由 line-length=140 宽限
ignore = ["E501"]

# 测试文件里常做 sys.path 注入（让 `python -m unittest discover -s tests` 也能跑），
# import 不在文件顶部，E402 是预期行为。
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
# 保留作者手工排版：不对单行集合/字典做强制换行
skip-magic-trailing-comma = true

# 渐进式类型检查：先只覆盖纯逻辑层（零 tkinter），GUI 暂不纳入
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["vcct/core", "vcct/schema.py", "vcct/store.py", "vcct/packs.py", "vcct/importer.py"]
exclude = ["tests", "build", "dist"]
reportMissingModuleSource = "none"

[tool.coverage.run]
branch = true
source = ["vcct"]
omit = ["vcct/ui/*", "vcct/winapi.py", "vcct/tray.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
