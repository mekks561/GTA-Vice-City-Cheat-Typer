name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (static check)
        run: ruff check vc_cheat_typer.py

      - name: Compile check
        run: python -m py_compile vc_cheat_typer.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
