name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff pyright coverage

      - name: Compile check
        run: python -m py_compile vc_cheat_typer.py

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Pyright (core only)
        run: pyright

      - name: Unit tests with coverage
        run: coverage run --branch -m unittest discover -s tests -v

      - name: Coverage report
        run: coverage report --show-missing
